[project]
name = "rag-knowledge-qa"
version = "0.1.0"
description = "RAG knowledge base QA system with hybrid retrieval and rerank"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Web
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.35.0",
    # 配置与工具
    "pydantic>=2.13.0,<2.14.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.20",
    # LangChain 生态（1.x 稳定版）
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-community>=0.4.1,<0.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    # 向量库
    "chromadb>=1.5.9",
    # Embedding
    "sentence-transformers>=5.7.0,<6.0.0",
    # 文档解析
    "pypdf>=5.0.0",
    "docx2txt>=0.9",
    "unstructured>=0.18.0",
    "markdown>=3.7",
    # 数据库
    "sqlalchemy>=2.0.40",
    # 工具
    "tqdm>=4.67.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "aiosqlite>=0.22.1",
    "ragas>=0.4.3",
    "datasets>=5.0.1",
    "pyjwt>=2.14.0",
    "bcrypt>=5.0.0",
    "langgraph>=1.2.11",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
